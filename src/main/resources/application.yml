server:
  port: 8080

spring:
  datasource:
     url: jdbc:mysql://localhost:3306/clinicdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
     username: root
     password: root@1234
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
     hibernate:
      format_sql: true
  flyway:
   enabled: true
   locations: classpath:db/migration
   baseline-on-migrate: true
sms:
  provider: console
